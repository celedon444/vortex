<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="login_prueba.js">
    <title>Login - Vortex</title>
</head>

<body>
    <div class="Contenedor">

        <div class="info">
            <img src="img/logo-vortex.png" alt="" class="logo">
            <p class="frase">Potencia tu mundo digital 🚀</p>
        </div>
        <div class="login">
            <h2 class="login_b">Bienvenido</h2>
            <p class="parrafo_login">Inicia sesión en tu cuenta para continuar</p>
            <input type="text" placeholder="Ingrese el usuario" class="boton1 boton" id="usuario">
            <input type="password" placeholder="Ingrese la contraseña" class="boton2 boton" id="contrasena">
            <a href="#" class="contrasenaO">Olvidaste la contraseña?</a>
            <button class="IniciarSesion" onclick="login()">Iniciar sesion</button>
            <p class="regirtrar">No tienes cuenta aún? <a class="color_registro" id="registroLink"  href="registro.html">Registrarse</a></p>
        </div>

    </div>

</body>
<script src="script.js">

</script>

</html>
